<section class="landing">

  <!-- HERO SECTION -->
  <div class="hero">
    <div class="hero-content">
      <h1>
        Reserve Your Ride <br />
        <span>Anytime, Anywhere</span>
      </h1>

      <p class="subtitle">
        Ride Reserve makes booking safe, fast, and affordable.
      </p>

      <button class="btn-primary" (click)="onGetStarted()">
        Get Started
      </button>
    </div>
  </div>

  <!-- FEATURES -->
  <div class="features">
    <div class="feature-card" *ngFor="let feature of features">
      <h3>{{ feature.title }}</h3>
      <p>{{ feature.description }}</p>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta">
    <h2>Ready to start your journey?</h2>
    <button class="btn-outline" (click)="onGetStarted()">
      Book a Ride Now
    </button>
  </div>

</section>
